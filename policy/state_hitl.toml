# Dates are the effective dates of the cited policy or amendment in this table.
# Modification and delay refer to adverse clinical dispositions, not ordinary pending.
[[rule]]
state = "TX"
effective = "2019-09-01"
plans = ["state_regulated_commercial", "federal_exchange_qhp"]
decisions = ["denial", "modification"]
bases = ["medical_necessity", "clinical_judgment"]
qualification = "licensed_competent_clinician"
source = "Tex. Ins. Code ch. 4201 and 28 TAC 19.1705-19.1710; https://tcss.legis.texas.gov/resources/IN/htm/IN.4201.htm"

[[rule]]
state = "TX"
effective = "2025-09-01"
issued_or_renewed_from = "2026-01-01"
