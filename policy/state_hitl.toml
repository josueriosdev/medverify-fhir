decisions = ["denial", "modification"]
bases = ["medical_necessity", "clinical_judgment"]
prohibit_automated_contribution = true
source = "Tex. Ins. Code 4201.002 and 4201.156, SB 815; https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00815F.htm"

