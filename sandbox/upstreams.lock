# Pinned upstreams for the local FHIR sandbox.
#
# scripts/fetch_sandbox.py --locked is the only consumer that writes anything: it downloads each
# source archive and artifact listed here, refuses any byte that does not match the recorded
# SHA-256, checks that every image and git build context in sandbox/docker-compose.yaml carries
# exactly the reference recorded here, and checks that each Inferno kit tag still names the
# recorded commit. Changing a pin means editing this file and the compose file together.

version = 1

[images.postgres]
reference = "postgres:16-alpine"
digest = "sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d"

